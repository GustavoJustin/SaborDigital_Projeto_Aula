<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="frontend/src/styles/global.css">
        <link rel="stylesheet" href="frontend/src/styles/cadastro.css">
        <title>TechFood - Cadastrar Prato</title>
    </head>
    <body>
        <header id="topo-loja">
            <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
            <p id="boas-vindas">Carregando...</p>
            
            <nav id="menu">
                <ul>
                    <li><a href="index.html">Cardápio</a></li>
                    <li><a href="pedidos.html">Meus Pedidos</a></li>
                    <li><a href="cadastro.html" class="menu-ativo">Cadastrar Prato</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2 class="titulo-secao">Cadastrar Novo Prato</h2>
            
            <div class="container-form">
                <form id="form-cadastro">
                    <div class="campo">
                        <label>Nome do Prato</label>
                        <input type="text" name="nome" placeholder="Digite o nome..." required>
                    </div>

                    <div class="campo">
                        <label>Descrição</label>
                        <input type="text" name="descricao" placeholder="Digite a descrição..." required>
                    </div>

                    <div class="campo">
                        <label>Preço (R$)</label>
                        <!-- type="text" para não ter as setinhas chatas -->
                        <input type="text" name="preco" placeholder="Ex: 25.90" required>
                    </div>

                    <div class="campo">
                        <label>Categoria</label>
                        <!-- Agora é um input simples para digitar, sem <option> -->
                        <input type="text" name="categoria" placeholder="Ex: Pizzas, Bebidas..." required>
                    </div>

                    <div class="campo">
                        <label>Imagem do Prato</label>
                        <input type="file" name="imagem" accept="image/*" required>
                    </div>

                    <button type="submit" id="btn-cadastrar">Cadastrar Prato</button>
                </form>
                <div id="mensagem-feedback"></div>
            </div>
        </main>

        <footer id="rodape">
            <p><strong>TechFood 2026</strong></p>
        </footer>

        <script src="frontend/src/scripts/global.js"></script>
        <script src="frontend/src/scripts/api.js"></script>
        <script src="frontend/src/scripts/cadastro.js"></script>
    </body>
</html>
